name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build, test, publish and WPF smoke
        shell: pwsh
        env:
          VIVIAN_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Build.ps1 -SmokeTest
      - name: Upload development build (simulated engines only)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: VIvian-dev-win-x64
          path: |
            artifacts/VIvian-win-x64.zip
            artifacts/VIvian-win-x64.zip.sha256
            artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verify M4 one-attempt stop boundary
        if: success()
        shell: pwsh
        run: dotnet test tests/VIvian.Tests/VIvian.Tests.csproj -c Release -p:M4ScreenTestBuild=true --filter FullyQualifiedName~StatusAndExactStopUseAuxiliarySupervisorWhileTaskUsesSingleRunLaunch
      - name: Test M4-F1 manual-test build flavor
        if: success()
        shell: pwsh
        run: dotnet test tests/VIvian.Tests/VIvian.Tests.csproj -c Release -p:M4ManualTestBuild=true --results-directory artifacts/tests-manual --logger "trx;LogFileName=manual-test-build.trx"
      - name: Test M5 daily build flavor
        if: success()
        shell: pwsh
        run: dotnet test tests/VIvian.Tests/VIvian.Tests.csproj -c Release -p:M5DailyTestBuild=true --results-directory artifacts/tests-m5 --logger "trx;LogFileName=m5-daily-build.trx"
      - name: Build M5 daily manual-test package
        if: success()
        shell: pwsh
        env:
          VIVIAN_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Build-M5DailyTest.ps1
      - name: Upload M5 daily manual-test package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: VIvian-M5-DailyTest-win-x64
          path: |
            artifacts/VIvian-M5-DailyTest-win-x64.zip
            artifacts/VIvian-M5-DailyTest-win-x64.zip.sha256
            artifacts/m5-daily-test/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build evidence and portable preview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VIvian-evidence
          path: |
            artifacts/logs
            artifacts/tests
            artifacts/smoke
            artifacts/VIvian-win-x64.zip
          retention-days: 14
