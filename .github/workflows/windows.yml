name: Windows M1 validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build, test, publish and WPF smoke
        shell: pwsh
        run: ./scripts/Build.ps1 -SmokeTest
      - name: Preserve build evidence and portable preview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VIvian-M1-evidence
          path: |
            artifacts/logs
            artifacts/tests
            artifacts/smoke
            artifacts/VIvian-M1-win-x64.zip
